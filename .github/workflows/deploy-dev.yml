name: Deploy Dev

on:
  push:
    branches: ["develop"]

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          docker pull ${{ env.IMAGE_PREFIX }}/backend:develop
          docker pull ${{ env.IMAGE_PREFIX }}/frontend:develop

      - name: Deploy
        run: |
          docker compose -f docker-compose.yml down
          IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} TAG=develop docker compose -f docker-compose.prod.yml up -d